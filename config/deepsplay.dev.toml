# Shared host configuration for local development (ADR 5).
#
# For personal settings, copy this file to config/deepsplay.local.toml
# (gitignored). Dev uses that file instead when it exists.
# DEEPSPLAY_CONFIG overrides both.

[server]
cache_dir      = "tmp/cache"
default_config = "lobby"
poll_interval  = "30s"
keep_revisions = 3

[[config]]
name = "lobby"
repo = "https://github.com/example/lobby-screen.git"
ref  = "main"

# A local repository, for building pages without pushing anywhere (ADR 6).
# Only committed changes are shown. Adjust the path and uncomment.
# [[config]]
# name = "local"
# repo = "file:///home/me/screens"
# ref  = "main"
