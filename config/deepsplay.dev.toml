# Shared host configuration for local development (ADR 5).
#
# For personal settings, copy this file to config/deepsplay.local.toml
# (gitignored). Dev uses that file instead when it exists.
# DEEPSPLAY_CONFIG overrides both.

[server]
cache_dir      = "tmp/cache"
default_config = "template"
poll_interval  = "30s"
keep_revisions = 3

# The template repository, so a fresh setup shows something (ADR 18). For
# your own content, create a repository from it and add it here or in your
# config/deepsplay.local.toml; see docs/pages.md.
[[config]]
name = "template"
repo = "https://github.com/deepestcyber/deepsplay-template.git"
ref  = "main"

# A local repository, for building pages without pushing anywhere (ADR 6).
# Only committed changes are shown. Adjust the path and uncomment.
# [[config]]
# name = "local"
# repo = "file:///home/me/screens"
# ref  = "main"

# A local directory served live: every save shows at once (ADR 12).
# [[config]]
# name = "live"
# path = "/home/me/screens"
