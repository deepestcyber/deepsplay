# Host configuration for the deepsplay container (ADR 5).
# Mounted at /etc/deepsplay/host.toml.

[server]
cache_dir      = "/var/lib/deepsplay/cache"   # on the container's volume
default_config = "lobby"                      # shown on /
poll_interval  = "30s"
keep_revisions = 3

[[config]]
name = "lobby"
repo = "https://github.com/example/lobby-screen.git"
ref  = "main"
# params = { theme = "dc" }   # default parameters for pages that declare them
# interrupt_token = "lobby_trigger"   # secret that may trigger interrupts (ADR 32)

# A private repository over SSH; the key comes from the secrets file.
# [[config]]
# name       = "kitchen"
# repo       = "git@github.com:example/private-screens.git"
# ref        = "main"
# credential = "github_deploy_key"

